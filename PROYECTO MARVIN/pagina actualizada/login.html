<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	  <title>Gamembers - Iniciar sesión</title>
  
	<link rel="stylesheet" href="css/gamembers-redesign.css">
	<link href="https://fonts.googleapis.com/css?family=Dosis:400,600,700|Roboto:400,500,700" rel="stylesheet">
	
</head>

<body id="top" class="auth-page">
  <div class="wrapper">
	
	<div class="container">
		<a class="gm-auth-brand" href="index.html">Gamembers</a>
		<p class="gm-eyebrow">Acceso de prueba</p>
		<h1>Perfil de juego</h1>
		<h4>Abre una sesión local de prueba.</h4>
		<p class="gm-login-note">Esta versión no tiene cuentas reales. El perfil y los tokens solo existen en este navegador; no escribas una contraseña.</p>
		<p class="gm-login-status" data-gm-login-status role="status" aria-live="polite">Elige un apodo para entrar a la ruleta original.</p>
		<form data-gm-login-form>
			<label for="gm-player-name">Nombre de jugador</label>
			<input id="gm-player-name" data-gm-player-input name="playerName" type="text" autocomplete="nickname" minlength="2" maxlength="30" placeholder="Tu apodo" required>
			<button type="submit">Iniciar sesión</button>
		</form>
		<a class="regresar" href="index.html#juegos-prueba">Volver a los juegos de prueba</a>
	</div>
	
	<ul class="bg-bubbles">
		<li></li>
		<li></li>
		<li></li>
		<li></li>
		<li></li>
		<li></li>
		<li></li>
		<li></li>
		<li></li>
		<li></li>
	</ul>
</div>
<script src="js/gamembers.js"></script>
</body>
</html>
